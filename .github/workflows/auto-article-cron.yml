name: Likhitfa Daily Auto Article Cron

on:
  schedule:
    # 4 runs per day (Bangkok UTC+7)
    # 07:00 (00:00 UTC) -> รอบเช้า morning
    # 10:00 (03:00 UTC) -> รอบสาย forenoon
    # 12:00 (05:00 UTC) -> รอบเที่ยง noon
    # 15:00 (08:00 UTC) -> รอบบ่าย afternoon
    - cron: '0 0,3,5,8 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Article slot (auto, morning, forenoon, noon, afternoon, evening)'
        required: false
        default: 'auto'
      force:
        description: 'Force generate even if already exists today'
        type: boolean
        required: false
        default: false

jobs:
  trigger-auto-article:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Likhitfa Article API
        run: |
          SLOT="${{ github.event.inputs.slot || 'auto' }}"
          FORCE="${{ github.event.inputs.force }}"
          CRON_SECRET="${{ secrets.CRON_SECRET || 'ninejoe-auto-articles-2026' }}"
          
          URL_PAGES="https://bazi-insight.pages.dev/api/cron-auto-article?key=${CRON_SECRET}&slot=${SLOT}"
          URL_DOMAIN="https://www.likhitfa.online/api/cron-auto-article?key=${CRON_SECRET}&slot=${SLOT}"
          if [ "$FORCE" = "true" ]; then
            URL_PAGES="${URL_PAGES}&force=true"
            URL_DOMAIN="${URL_DOMAIN}&force=true"
          fi
          
          echo "Triggering Likhitfa Auto Article API..."
          echo "Slot: $SLOT | Force: $FORCE"
          
          # Try Cloudflare Pages direct endpoint first (bypasses Zone WAF/Bot Challenge)
          RESPONSE=$(curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" -w "\nHTTP_STATUS:%{http_code}" "$URL_PAGES")
          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Primary endpoint returned $HTTP_STATUS, trying custom domain fallback..."
            RESPONSE=$(curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" -w "\nHTTP_STATUS:%{http_code}" "$URL_DOMAIN")
            HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)
          fi
          
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response Body: $HTTP_BODY"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::API returned non-200 status: $HTTP_STATUS"
            exit 1
          fi
          
          echo "Auto article trigger executed successfully!"
